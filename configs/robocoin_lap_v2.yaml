common:
  # RoboCOIN samples are mapped directly into masked canonical55_v2 vectors.
  action_dim: 55
  state_dim: 55

  num_video_frames: 8
  video_height: 384
  video_width: 320

  global_downsample_rate: 3
  video_action_freq_ratio: 2

dataset:
  type: "lerobot_robocoin"
  canonical_format: "canonical55_v2"
  task_mode: "multi"
  task_name: null
  max_episodes: null
  image_aug: false
  use_language_action: true
  canonical_normalization:
    enabled: true
    stats_path: "data/utils/stat.json"
    stats_key: "robocoin"
    normalize_state: true
    normalize_action: true
  params:
    root: "/root/nas/code/d0/data/robot_data/robocoin"
    repo_id: "RoboCOIN"
    embodiment_type: "aloha_agilex_2"
    language_action_dir_name: "language_action"
    enable_t5_fallback: false
    t5_folder_name: "t5_embedding"
    bad_episodes_path: "outputs/motus-robocoin_lap_v2/robocoin_full_integrity_scan_20260803/bad_episodes.jsonl"
    skip_bad_episodes: true
    sample_retry_attempts: 16
    sample_fallback_attempts: 64
    task_discovery:
      enabled: true
      validate_episodes: true

model:
  wan:
    config_path: "./pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "./pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "./pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "./pretrained_models/Qwen3-VL-2B-Instruct"
    # checkpoint_path: "/root/nas/xicheng/qwen3vl_2b_repro/outputs/qwen3vl2b_full_40pct_8gpu_nframes16/checkpoint-74056"
    precision: "bfloat16"
    frozen: false

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 1
  max_steps: 2000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: true

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 2000
  val_interval: 1000
  num_workers: 8
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: null

resume:
  checkpoint_path: null
  reset_scheduler: false

finetune:
  checkpoint_path: ./pretrained_models/Motus
