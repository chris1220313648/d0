common:
  # AgiBot returns 24-D actions; EgoVerse zero actions are padded/masked.
  action_dim: 24
  state_dim: 14

  # Shared video settings
  num_video_frames: 8
  video_height: 384
  video_width: 320

  # Default AgiBot sampling settings. EgoVerse overrides these below.
  global_downsample_rate: 3
  video_action_freq_ratio: 2

# Dataset configuration
dataset:
  type: "multi"
  sampling: "weighted"
  target_action_dim: 24
  target_state_dim: 14
  datasets:
    - name: "agibot_lerobot_split"
      type: "lerobot_agibot"
      weight: 0.4425
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      params:
        root: "/root/nas/code/d0/data/robot_data/AgiBotWorld2026"
        repo_id: "AgiBotWorld2026"
        # AgiBot disables action normalization, but the LeRobot base class still
        # loads a stat key during init. Use an existing key to keep init valid.
        embodiment_type: "aloha_agilex_2"
        language_action_dir_name: "language_action"
        enable_t5_fallback: false
        task_discovery:
          enabled: true
          suffix: "_split"
          required:
            - "meta/info.json"
            - "data"
            - "videos"
      common:
        global_downsample_rate: 3
        video_action_freq_ratio: 2

    - name: "human_video_egoverse"
      type: "egoverse_trimodal"
      weight: 0.4000
      train_manifest: "/root/nas/usbdata/D0_huamn_dataset/EgoVerse/motus_pretrain/manifests/train.jsonl"
      val_manifest: "/root/nas/usbdata/D0_huamn_dataset/EgoVerse/motus_pretrain/manifests/val.jsonl"
      action_mode: "zeros"
      image_aug: false
      seed: 0
      params:
        adaptive_downsample: true
        min_downsample_rate: 2
        max_downsample_rate: 8
      common:
        global_downsample_rate: 8
        video_action_freq_ratio: 2

    - name: "image_qa"
      type: "image_qa"
      weight: 0.1000
      json_path: "/root/nas/xicheng/d0_handoff_imageqa/json/imageqa_train_no8_10pct.json"
      image_root: "/root/nas/qa_data/processed_qwen_vl"
      max_samples: null
      max_length: 280
      shuffle: true
      seed: 42

    - name: "droid_pt_v5"
      type: "droid"
      weight: 0.0498
      dataset_dir: "/root/nas/code/d0/data/robot_data/droid_dataset"
      data_mode: "both"
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      enable_setup_control_suffix: false
      setup_text: "single-arm Franka Panda robot with parallel gripper"
      normalize_actions: true
      stats_key: "droid"
      state_stats_signal: "qpos"
      action_stats_signal: "epos"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "fractal_pt_v5"
      type: "fractal_bridge"
      weight: 0.0055
      dataset_dir: "/root/nas/code/d0/data/robot_data/fractal"
      data_mode: "both"
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      enable_setup_control_suffix: false
      setup_text: "Google RT-1 mobile manipulator robot with gripper"
      normalize_actions: true
      stats_key: "fractal"
      state_stats_signal: "qpos"
      action_stats_signal: "epos"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "bridge_pt_v5"
      type: "bridge"
      weight: 0.0022
      dataset_dir: "/root/nas/code/d0/data/robot_data/bridge_dataset"
      data_mode: "both"
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      enable_setup_control_suffix: false
      setup_text: "single-arm WidowX robot with parallel gripper"
      normalize_actions: true
      stats_key: "bridge"
      state_stats_signal: "qpos"
      action_stats_signal: "epos"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

# Model configuration
model:
  wan:
    config_path: "./pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "./pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "./pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "./pretrained_models/Qwen3-VL-2B-Instruct"
    # checkpoint_path: "/root/nas/xicheng/qwen3vl_2b_repro/outputs/qwen3vl2b_full_40pct_8gpu_nframes16/checkpoint-74056"
    precision: "bfloat16"
    frozen: false

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

# Training configuration
training:
  batch_size: 3
  max_steps: 400000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: true

# System settings
system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 50000
  val_interval: 10000
  num_workers: 16
  pin_memory: true

# Logging settings
logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: null

# Resume training settings
resume:
  checkpoint_path: /root/nas/code/d0/checkpoints/multidataset_lap_v1/multidataset_lap_v1_lap_hypertrain/checkpoint_step_250000
  reset_scheduler: false

# Finetune settings
finetune:
  # checkpoint_path: ./pretrained_models/Motus
  checkpoint_path: ./pretrained_models/Motus
