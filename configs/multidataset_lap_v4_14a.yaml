common:
  # Native 14D vectors:
  # action = [left EEF xyz+rpy or joints 1-6, left gripper, right EEF xyz+rpy or joints 1-6, right gripper]
  # state  = [left arm joints 1-6, left gripper, right arm joints 1-6, right gripper]
  action_dim: 14
  state_dim: 14

  # Shared video settings
  num_video_frames: 8
  video_height: 384
  video_width: 320

  # Default robot sampling settings. Individual datasets override where needed.
  global_downsample_rate: 3
  video_action_freq_ratio: 2

# Dataset configuration
dataset:
  type: "multi"
  sampling: "weighted"
  target_action_dim: 14
  target_state_dim: 14
  datasets:
    - name: "agibot_lerobot_split"
      type: "lerobot_agibot"
      weight: 0.1000000
      # Keep validation RobotWin-only: do not build a second full AgiBot dataset.
      use_for_val: false
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      enable_setup_control_suffix: true
      setup_text: "dual-arm AgiBot robot with grippers"
      action_stats_signal: "epos"
      normalize_actions: false
      params:
        root: "/root/nas/code/d0/data/robot_data/AgiBotWorld2026"
        repo_id: "AgiBotWorld2026"
        embodiment_type: "aloha_agilex_2"
        language_action_dir_name: "language_action"
        enable_t5_fallback: false
        output_format: "dual_eef14_joint14"
        task_discovery:
          enabled: true
          suffix: "_split"
          validate_episodes: true
          required:
            - "meta/info.json"
            - "data"
            - "videos"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "bridge_pt_v5"
      type: "bridge"
      weight: 0.0327670
      use_for_val: false
      dataset_dir: "/root/nas/code/d0/data/robot_data/bridge_dataset"
      data_mode: "both"
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      enable_setup_control_suffix: true
      setup_text: "single-arm WidowX robot with parallel gripper"
      normalize_actions: true
      state_stats_signal: "qpos"
      action_stats_signal: "epos"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "droid_pt_v5"
      type: "droid"
      weight: 0.0908633
      use_for_val: false
      dataset_dir: "/root/nas/code/d0/data/robot_data/droid_dataset"
      data_mode: "both"
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      enable_setup_control_suffix: true
      setup_text: "single-arm Franka Panda robot with parallel gripper"
      normalize_actions: true
      state_stats_signal: "qpos"
      action_stats_signal: "epos"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "fractal_pt_v5"
      type: "fractal_bridge"
      weight: 0.0456773
      use_for_val: false
      dataset_dir: "/root/nas/code/d0/data/robot_data/fractal"
      data_mode: "both"
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      enable_setup_control_suffix: true
      setup_text: "Google RT-1 mobile manipulator robot with gripper"
      normalize_actions: true
      state_stats_signal: "qpos"
      action_stats_signal: "epos"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "interndata_a1"
      type: "lerobot_interndata"
      weight: 0.2006925
      # Keep validation RobotWin-only: do not build a second full InternData dataset.
      use_for_val: false
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: false
      enable_setup_control_suffix: true
      setup_text: "InternData robot with gripper"
      action_stats_signal: "epos"
      normalize_actions: false
      params:
        root: "/root/nas/code/d0/data/robot_data/interndata"
        repo_id: "InternData-A1"
        embodiment_type: "aloha_agilex_2"
        language_action_dir_name: "language_action"
        enable_t5_fallback: false
        t5_folder_name: "t5_embedding"
        output_format: "dual_eef14_joint14"
        task_discovery:
          enabled: true
          validate_episodes: true
          required:
            - "meta/info.json"
            - "data"
            - "videos"
            - "t5_embedding/episode_000000.pt"
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2
    - name: "robotwin"
      type: "robotwin"
      weight: 0.2000
      use_for_val: true
      dataset_dir: "/root/nas/code/d0/data/robot_data/robotwin/dataset"
      data_mode: "both"
      task_mode: "multi"
      task_name: null
      max_episodes: null
      image_aug: false
      use_language_action: true
      common:
        global_downsample_rate: 3
        video_action_freq_ratio: 2

    - name: "human_video_egoverse"
      type: "egoverse_trimodal"
      weight: 0.2436827
      use_for_val: false
      train_manifest: "/root/nasbak2/shuai/ready_data_egoverse/processed/egoverse_active_wrist/manifests/train.jsonl"
      val_manifest: "/root/nasbak2/shuai/ready_data_egoverse/processed/egoverse_active_wrist/manifests/val.jsonl"
      action_mode: "zeros"
      image_aug: false
      seed: 0
      params:
        adaptive_downsample: false
        min_downsample_rate: 2
        max_downsample_rate: 4
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "human_video_egodex"
      type: "egoverse_trimodal"
      weight: 0.0419038
      use_for_val: false
      train_manifest: "/root/nasbak/shuai/ready_data/processed/egodex_active_wrist/manifests/train.jsonl"
      val_manifest: "/root/nasbak/shuai/ready_data/processed/egodex_active_wrist/manifests/val.jsonl"
      action_mode: "zeros"
      image_aug: false
      seed: 0
      params:
        adaptive_downsample: false
        min_downsample_rate: 2
        max_downsample_rate: 4
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

    - name: "human_video_vitra"
      type: "egoverse_trimodal"
      weight: 0.0444135
      use_for_val: false
      train_manifest: "/root/nasbak/shuai/ready_data/processed/vitra_active_wrist/manifests/train.jsonl"
      val_manifest: "/root/nasbak/shuai/ready_data/processed/vitra_active_wrist/manifests/val.jsonl"
      action_mode: "zeros"
      image_aug: false
      seed: 0
      params:
        adaptive_downsample: false
        min_downsample_rate: 2
        max_downsample_rate: 4
      common:
        global_downsample_rate: 1
        video_action_freq_ratio: 2

# Model configuration
model:
  wan:
    config_path: "./pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "./pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "./pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    # checkpoint_path: "./pretrained_models/Qwen3-VL-2B-Instruct"
    checkpoint_path: "/root/nas/xicheng/qwen3vl_2b_repro/outputs/qwen3vl2b_full_40pct_8gpu_nframes16/checkpoint-74056"
    precision: "bfloat16"
    frozen: false
    # Keep the VLM initialized from checkpoint_path instead of the Motus finetune checkpoint.
    load_from_finetune_checkpoint: false

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
    vlm_loss_weight: 0.2

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

# Training configuration
training:
  batch_size: 4
  max_steps: 200000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: true

# System settings
system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 40000
  val_interval: 5000
  num_workers: 2
  pin_memory: true

# Logging settings
logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: null

# Resume training settings
resume:
  checkpoint_path: null
  reset_scheduler: false

# Finetune settings
finetune:
  # checkpoint_path: ./pretrained_models/Motus
  checkpoint_path: ./pretrained_models/Motus
