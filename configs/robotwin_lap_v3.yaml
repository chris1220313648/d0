common:
  # canonical55_v2 state/action vectors.
  action_dim: 55
  state_dim: 55

  # Video settings
  num_video_frames: 8
  video_height: 384
  video_width: 320

  # Sampling strategy parameters
  global_downsample_rate: 3
  video_action_freq_ratio: 2

# Dataset configuration
dataset:
  type: "robotwin"
  canonical_format: "canonical55_v2"

  dataset_dir: "/root/nas/code/d0/data/robot_data/robotwin/dataset"

  data_mode: "both"
  task_mode: "multi"
  task_name: null

  max_episodes: null

  image_aug: false
  use_language_action: true
  # enable_ik_language_action_sampling: false
  # ik_language_action_sampling_rate: 0.2

# Model configuration
model:
  wan:
    config_path: "./pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "./pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "./pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "./pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: false

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
    vlm_loss_weight: 1.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

# Training configuration
training:
  batch_size: 4
  max_steps: 100000
  learning_rate: 5.0e-5
  weight_decay: 0.01

  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4

  grad_clip_norm: 0.5
  use_amp: true

  find_unused_parameters: false
  train_lap: true

# System settings
system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"

  log_interval: 1
  save_interval: 25000
  val_interval: 5000

  num_workers: 8
  pin_memory: true

# Logging settings
logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: null

# Resume training settings
resume:
  checkpoint_path: null
  reset_scheduler: false

# Finetune settings
finetune:
  checkpoint_path: /root/nas/code/d0/checkpoints/multidataset_lap_v3/multidataset_lap_v3_lap_hypertrain/checkpoint_step_160000/pytorch_model/mp_rank_00_model_states.pt
