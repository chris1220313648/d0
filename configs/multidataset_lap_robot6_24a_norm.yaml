# Seven sources: original robot6 plus RoboDojo; filename retained for launcher compatibility.
# Action order: left arm 6, left hand 6, right arm 6, right hand 6.
# GR1: consecutive target-pose deltas in base frame + unchanged hand commands (24D).
# Raw LeRobot_v21_eef24 stays absolute; the loader converts poses before normalization.
# State remains 14D. Start from pretraining, never resume the old joint-action smoke.
common:
  action_dim: 24
  state_dim: 14
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 3
  video_action_freq_ratio: 2
dataset:
  type: multi
  sampling: weighted
  target_action_dim: 24
  target_state_dim: 14
  datasets:
  - name: bridge_pt_v5
    type: bridge
    weight: 1.0
    use_for_val: true
    dataset_dir: /root/nas/code/d0/data/robot_data/bridge_dataset
    data_mode: both
    task_mode: multi
    task_name: null
    max_episodes: null
    image_aug: false
    use_language_action: true
    enable_setup_control_suffix: true
    setup_text: single-arm WidowX robot with parallel gripper
    normalize_actions: true
    state_stats_signal: qpos
    action_stats_signal: epos
    common:
      global_downsample_rate: 1
      video_action_freq_ratio: 2
  - name: droid_pt_v5
    type: droid
    weight: 1.0
    use_for_val: false
    dataset_dir: /root/nas/code/d0/data/robot_data/droid_dataset
    data_mode: both
    task_mode: multi
    task_name: null
    max_episodes: null
    image_aug: false
    use_language_action: true
    enable_setup_control_suffix: true
    setup_text: single-arm Franka Panda robot with parallel gripper
    normalize_actions: true
    state_stats_signal: qpos
    action_stats_signal: epos
    common:
      global_downsample_rate: 1
      video_action_freq_ratio: 2
  - name: fractal_pt_v5
    type: fractal_bridge
    weight: 1.0
    use_for_val: false
    dataset_dir: /root/nas/code/d0/data/robot_data/fractal
    data_mode: both
    task_mode: multi
    task_name: null
    max_episodes: null
    image_aug: false
    use_language_action: true
    enable_setup_control_suffix: true
    setup_text: Google RT-1 mobile manipulator robot with gripper
    normalize_actions: true
    state_stats_signal: qpos
    action_stats_signal: epos
    common:
      global_downsample_rate: 1
      video_action_freq_ratio: 2
  - name: cosmos
    type: lerobot_sim
    weight: 1.0
    use_for_val: false
    dataset_dir: /root/nas/code/d0/data/robot_data/RoboCasa-Cosmos-Policy_lerobot_v21
    task_mode: multi
    task_name: null
    max_episodes: null
    image_aug: false
    normalize_actions: true
    use_language_action: true
    params:
      sim_kind: cosmos
      stats_path: data/utils/robot6_sim_eef24_delta_leftfirst_stats.json
      visual_keys:
      - observation.images.robot0_agentview_left
      - observation.images.robot0_agentview_right
      - observation.images.robot0_eye_in_hand
      enable_t5_fallback: false
    common:
      global_downsample_rate: 1
      video_action_freq_ratio: 2
  - name: xemb
    type: lerobot_sim
    weight: 1.0
    use_for_val: false
    dataset_dir: /root/nas/code/d0/data/robot_data/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim_v21
    task_mode: multi
    task_name: null
    max_episodes: null
    image_aug: false
    normalize_actions: true
    use_language_action: true
    params:
      sim_kind: xemb
      stats_path: data/utils/robot6_sim_eef24_delta_leftfirst_stats.json
      visual_keys:
      - observation.images.left_view
      - observation.images.right_view
      - observation.images.wrist_view
      enable_t5_fallback: false
    common:
      global_downsample_rate: 1
      video_action_freq_ratio: 2
  - name: gr1
    type: lerobot_sim
    weight: 1.0
    use_for_val: false
    dataset_dir: /root/nas/code/d0/data/robot_data/PhysicalAI-Robotics-GR00T-Teleop-Sim/LeRobot_v21_eef24
    task_mode: multi
    task_name: null
    max_episodes: null
    image_aug: false
    normalize_actions: true
    use_language_action: true
    params:
      sim_kind: gr1_eef24_delta
      stats_path: data/utils/robot6_sim_eef24_delta_leftfirst_stats.json
      visual_keys:
      - observation.images.ego_view
      enable_t5_fallback: false
    common:
      global_downsample_rate: 1
      video_action_freq_ratio: 2
  - name: robodojo
    type: robodojo
    weight: 1.0
    use_for_val: false
    dataset_dir: /root/nas/code/d0/data/robot_data/RoboDojo_joint24
    params:
      action_signal: action_joint
    data_mode: clean
    task_mode: multi
    task_name: null
    max_episodes: null
    image_aug: false
    use_language_action: true
    common:
      global_downsample_rate: 1
      video_action_freq_ratio: 2
model:
  wan:
    config_path: ./pretrained_models/Wan2.2-TI2V-5B
    checkpoint_path: ./pretrained_models/Wan2.2-TI2V-5B
    vae_path: ./pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    precision: bfloat16
  vlm:
    checkpoint_path: ./pretrained_models/Qwen3-VL-2B-Instruct
    precision: bfloat16
    frozen: false
    load_from_finetune_checkpoint: false
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: mlp3x_silu
  time_distribution:
    timestep_sample_method: logit_normal
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
    vlm_loss_weight: 0.2
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
training:
  batch_size: 5
  max_steps: 200000
  learning_rate: 5.0e-05
  weight_decay: 0.01
  scheduler_type: linear
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: true
  gradient_accumulation_steps: 1
system:
  checkpoint_dir: ./checkpoints
  log_level: INFO
  log_interval: 1
  save_interval: 40000
  val_interval: 5000
  num_workers: 2
  pin_memory: true
logging:
  report_to: tensorboard
  wandb_project: motus
  tensorboard_log_dir: tensorboard_logs
  run_name: null
resume:
  checkpoint_path: null
  reset_scheduler: false
finetune:
  checkpoint_path: ./pretrained_models/Motus
