common:
  # VITRA human video segments use zero-masked action tokens in the existing trimodal loader.
  action_dim: 55
  state_dim: 55

  num_video_frames: 8
  video_height: 384
  video_width: 320

  global_downsample_rate: 8
  video_action_freq_ratio: 2

dataset:
  type: "egoverse_trimodal"
  canonical_format: "canonical55_v2"
  train_manifest: "/root/nasbak/shuai/ready_data/processed/vitra_active_wrist/manifests/train.jsonl"
  val_manifest: "/root/nasbak/shuai/ready_data/processed/vitra_active_wrist/manifests/val.jsonl"
  action_mode: "zeros"
  image_aug: false
  seed: 0
  params:
    adaptive_downsample: true
    min_downsample_rate: 2
    max_downsample_rate: 8

model:
  wan:
    config_path: "./pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "./pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "./pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "/root/nas/xicheng/qwen3vl_2b_repro/outputs/qwen3vl2b_full_40pct_8gpu_nframes16/checkpoint-74056"
    precision: "bfloat16"
    frozen: false
    load_from_finetune_checkpoint: false

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 1
  max_steps: 2000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: true

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 2000
  val_interval: 1000
  num_workers: 8
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: null

resume:
  checkpoint_path: null
  reset_scheduler: false

finetune:
  checkpoint_path: "./pretrained_models/Motus"
