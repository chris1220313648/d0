common:
  action_dim: 14
  state_dim: 14
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 1
  video_action_freq_ratio: 6
dataset:
  type: multi
  target_action_dim: 14
  target_state_dim: 14
  datasets:
  - name: charging_cable_middle_1
    type: lerobot_ola_v3
    weight: 5.0
    use_for_val: true
    dataset_dir: /root/nas/piper_data/long_horizon/charging-cable-middle-1-trim-3
    max_episodes: null
    image_aug: false
    use_language_action: true
    params:
      state_key: observation.state
      eef_state_key: observation.ee_pose
      absolute_action_key: action.ee_pose
      camera_keys:
      - observation.images.right_front
      - observation.images.left_wrist
      - observation.images.right_wrist
      gripper_closed_value: 0.0
      gripper_open_value: 100.0
      normalize_state: true
      normalize_actions: true
      normalization_mode: q01_q99
      stats_path: /root/nas/piper_data/motus_shared/long_horizon_all_v2_stats.json
      motus_dir_name: motus
      video_backend: pyav
      shard_cache_size: 2
      task_text_filter: Tidy up the desk.
