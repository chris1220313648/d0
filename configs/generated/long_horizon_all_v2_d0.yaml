model:
  flow_source:
    mode: history
    video_mode: gaussian
    action_noise_std: 0.02
    history_length: 48
  future_video_noise_augmentation:
    enabled: true
    probability: 0.5
    min_scale: 0.5
    max_scale: 1.0
    future_start_index: 1
  wan:
    config_path: ./pretrained_models/Wan2.2-TI2V-5B
    checkpoint_path: ./pretrained_models/Wan2.2-TI2V-5B
    vae_path: ./pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    precision: bfloat16
  vlm:
    checkpoint_path: ./pretrained_models/Qwen3-VL-2B-Instruct
    precision: bfloat16
    frozen: false
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1.0e-05
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1.0e-05
    vlm:
      input_dim: 2048
      projector_type: mlp3x_silu
  time_distribution:
    timestep_sample_method: logit_normal
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
    vlm_loss_weight: 0.1
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
training:
  batch_size: 5
  gradient_accumulation_steps: 2
  max_steps: 60000
  learning_rate: 5.0e-05
  weight_decay: 0.01
  scheduler_type: linear
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: true
system:
  checkpoint_dir: ./checkpoints
  log_level: INFO
  log_interval: 1
  save_interval: 10000
  val_interval: 2000
  num_workers: 8
  pin_memory: true
logging:
  report_to: wandb
  wandb_project: motus
  tensorboard_log_dir: tensorboard_logs
  run_name: null
resume:
  checkpoint_path: null
  reset_scheduler: false
finetune:
  checkpoint_path: /root/nas/code/d0/pretrained_models/d0_v/mp_rank_00_model_states.pt
